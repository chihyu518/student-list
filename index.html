<script>


const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyv3-omK-QEzQUOxo8btegugZwM3TuuAHCEdZMWWA-RecRakp6b84BfEh2vZ17evAnddA/exec";



/* =========================
   學生資料
========================= */

let allStudents = [];

let editingStudentId = null;



/* =========================
   新增學生課程按鈕
========================= */

const courseButtons =
  document.querySelectorAll(".course");


courseButtons.forEach(function(button) {

  button.addEventListener("click", function() {

    button.classList.toggle("selected");

  });

});



/* =========================
   新增學生
========================= */

document
  .getElementById("addButton")
  .addEventListener("click", function() {


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const grade =
      document
        .getElementById("grade")
        .value;


    const status =
      document
        .getElementById("status")
        .value;


    const courses =
      Array.from(
        document.querySelectorAll(".course.selected")
      )
      .map(function(button) {

        return button.dataset.course;

      });


    if (!name) {

      alert("請輸入學生姓名");

      return;

    }


    if (!grade) {

      alert("請選擇年級");

      return;

    }


    if (courses.length === 0) {

      alert("請至少選擇一個課程");

      return;

    }


    const data = {

      name: name,

      grade: grade,

      status: status,

      courses: courses

    };


    const button =
      document.getElementById("addButton");


    button.disabled = true;

    button.textContent = "新增中⋯";


    fetch(GAS_URL, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body: JSON.stringify(data)

    })

    .then(function(response) {

      return response.text();

    })

    .then(function() {


      document
        .getElementById("message")
        .textContent =
          "✅ 學生新增成功！";


      document
        .getElementById("name")
        .value = "";


      document
        .getElementById("grade")
        .value = "";


      courseButtons.forEach(function(button) {

        button.classList.remove("selected");

      });


      loadStudents();

    })

    .catch(function(error) {


      document
        .getElementById("message")
        .textContent =
          "❌ 新增失敗，請稍後再試";


      console.error(error);

    })

    .finally(function() {


      button.disabled = false;

      button.textContent =
        "➕ 新增學生";

    });


  });



/* =========================
   讀取學生
========================= */

function loadStudents() {


  const studentList =
    document.getElementById("studentList");


  studentList.textContent =
    "載入中⋯";


  fetch(GAS_URL)

    .then(function(response) {

      return response.json();

    })

    .then(function(data) {


      if (!data.success) {

        throw new Error(
          data.message || "讀取失敗"
        );

      }


      allStudents =
        data.students || [];


      renderStudents(allStudents);
      updateCourseStats(allStudents);
    })

    .catch(function(error) {


      studentList.textContent =
        "❌ 無法取得學生資料";


      console.error(error);

    });

}



/* =========================
   顯示學生
========================= */

function renderStudents(students) {
  const gradeOrder = [
    "一年級",
    "二年級",
    "三年級",
    "四年級",
    "五年級",
    "六年級",
    "國一",
    "國二",
    "國三"
  ];

  students.sort(function(a, b) {

    return (
      gradeOrder.indexOf(a.grade) -
      gradeOrder.indexOf(b.grade)
    );

  });
  
    // =========================
  // 學生人數統計
  // =========================

  const totalCount =
    document.getElementById("totalCount");

  const activeCount =
    document.getElementById("activeCount");

  const pauseCount =
    document.getElementById("pauseCount");

  const endCount =
    document.getElementById("endCount");

  totalCount.textContent =
    students.length;

  activeCount.textContent =
    students.filter(function(student) {
      return student.status === "🟢 上課中";
    }).length;

  pauseCount.textContent =
    students.filter(function(student) {
      return student.status === "🟡 暫停";
    }).length;

  endCount.textContent =
    students.filter(function(student) {
      return student.status === "🔴 結束";
    }).length;
  

  const studentList =
    document.getElementById("studentList");


  studentList.innerHTML = "";


  if (students.length === 0) {

    studentList.textContent =
      "找不到符合的學生";

    return;

  }


  students.forEach(function(student) {


    const card =
      document.createElement("div");


    card.style.padding = "14px";

    card.style.marginBottom = "10px";

    card.style.border =
      "1px solid #eee";

    card.style.borderRadius =
      "12px";

    card.style.background =
      "#fafafa";


    card.innerHTML = `

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
      ">

        <div style="
          font-size:18px;
          font-weight:bold;
        ">
          ${student.name}
        </div>


<div style="
  display:flex;
  gap:6px;
  align-items:center;
">

  <button
    onclick="editStudent('${student.id}')"
    style="
      width:auto;
      margin-top:0;
      border:none;
      background:#f0f0f0;
      color:#333;
      padding:7px 12px;
      border-radius:8px;
      cursor:pointer;
      font-size:14px;
    "
  >
    ✏️ 編輯
  </button>

  <button
    onclick="deleteStudent('${student.id}')"
    style="
      width:auto;
      margin-top:0;
      border:none;
      background:#ffecec;
      color:#d33;
      padding:7px 12px;
      border-radius:8px;
      cursor:pointer;
      font-size:14px;
    "
  >
    🗑️ 刪除
  </button>

</div>
      </div>


      <div style="margin-top:6px;">
        🎓 ${student.grade || "未設定"}
      </div>


      <div style="margin-top:6px;">
        ${student.status || "⚪ 未設定"}
      </div>


      <div style="margin-top:6px;">
        📚 ${
          student.courses &&
          student.courses.length > 0
            ? student.courses.join("、")
            : "未設定"
        }
      </div>

    `;


    studentList.appendChild(card);

  });

}



/* =========================
   搜尋學生
========================= */

/* =========================
   搜尋＋年級＋狀態＋課程篩選
========================= */

function filterStudents() {

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const grade =
    document
      .getElementById("gradeFilter")
      .value;

  const status =
    document
      .getElementById("statusFilter")
      .value;

  const course =
    document
      .getElementById("courseFilter")
      .value;

  const filteredStudents =
    allStudents.filter(function(student) {

      const nameMatch =
        (student.name || "")
          .toLowerCase()
          .includes(keyword);

      const gradeMatch =
        !grade ||
        student.grade === grade;

      const statusMatch =
        !status ||
        student.status === status;

      const courseMatch =
        !course ||
        (student.courses || []).includes(course);

      return (
        nameMatch &&
        gradeMatch &&
        statusMatch &&
        courseMatch
      );

    });

  renderStudents(filteredStudents);
  updateStudentStats(filteredStudents);
  updateCourseStats(filteredStudents);
}
  function updateStudentStats(students) {

  document.getElementById("totalCount").textContent =
    students.length;

  document.getElementById("activeCount").textContent =
    students.filter(function(student) {
      return student.status === "🟢 上課中";
    }).length;

  document.getElementById("pauseCount").textContent =
    students.filter(function(student) {
      return student.status === "🟡 暫停";
    }).length;

  document.getElementById("endCount").textContent =
    students.filter(function(student) {
      return student.status === "🔴 結束";
    }).length;

}

  function updateCourseStats(students) {

  const courses = [
    "英文",
    "數學",
    "課輔",
    "理化",
    "私中英文",
    "私中數學",
    "私中國文"
  ];

  const courseStats =
    document.getElementById("courseStats");

  if (!courseStats) {
    return;
  }

  courseStats.innerHTML = "";

  courses.forEach(function(course) {

    const count =
      students.filter(function(student) {

        return (student.courses || [])
          .includes(course);

      }).length;

    const box =
      document.createElement("div");

    box.style.padding = "10px 14px";
    box.style.background = "#f5f5f5";
    box.style.borderRadius = "10px";
    box.style.fontSize = "14px";

    box.textContent =
      "📚 " + course + " " + count + "人";

    courseStats.appendChild(box);

  });

}
  
  function updateCourseStats(students) {

  const courses = [
    "英文",
    "數學",
    "課輔",
    "理化",
    "私中英文",
    "私中數學",
    "私中國文"
  ];

  const courseStats =
    document.getElementById("courseStats");

  courseStats.innerHTML = "";

  courses.forEach(function(course) {

    const count =
      students.filter(function(student) {

        return (student.courses || [])
          .includes(course);

      }).length;

    const box =
      document.createElement("div");

    box.style.padding = "10px 14px";
    box.style.background = "#f5f5f5";
    box.style.borderRadius = "10px";
    box.style.fontSize = "14px";

    box.textContent =
      "📚 " + course + " " + count + "人";

    courseStats.appendChild(box);

  });

}
  

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    filterStudents
  );

document
  .getElementById("gradeFilter")
  .addEventListener(
    "change",
    filterStudents
  );

document
  .getElementById("statusFilter")
  .addEventListener(
    "change",
    filterStudents
  );

document
  .getElementById("courseFilter")
  .addEventListener(
    "change",
    filterStudents
  );

   開啟編輯視窗
========================= */

  /* =========================
   刪除學生
========================= */

function deleteStudent(id) {

  const student =
    allStudents.find(function(student) {
      return student.id === id;
    });


  if (!student) {

    alert("找不到學生資料");

    return;

  }


  const confirmed =
    confirm(
      "確定要刪除「" +
      student.name +
      "」嗎？\n\n刪除後會從學生名單中移除。"
    );


  if (!confirmed) {

    return;

  }


  fetch(GAS_URL, {

    method: "POST",

    headers: {
      "Content-Type":
        "text/plain;charset=utf-8"
    },

    body: JSON.stringify({

      action: "delete",

      id: id

    })

  })

  .then(function(response) {

    return response.json();

  })

  .then(function(data) {

    if (!data.success) {

      throw new Error(
        data.message || "刪除失敗"
      );

    }


    alert(
      "✅ 「" +
      student.name +
      "」已刪除！"
    );


    loadStudents();

  })

  .catch(function(error) {

    alert("❌ 刪除失敗");

    console.error(error);

  });

}
  
function editStudent(id) {


  const student =
    allStudents.find(function(student) {

      return student.id === id;

    });


  if (!student) {

    alert("找不到學生資料");

    return;

  }


  editingStudentId = id;


  document
    .getElementById("editName")
    .value =
      student.name || "";


  document
    .getElementById("editGrade")
    .value =
      student.grade || "";


  document
    .getElementById("editStatus")
    .value =
      student.status || "";


  const courses =
    student.courses || [];


  document
    .querySelectorAll(".editCourse")
    .forEach(function(button) {


      const course =
        button.textContent.trim();


      if (courses.includes(course)) {

        button.classList.add("selected");

      } else {

        button.classList.remove("selected");

      }

    });


  document
    .getElementById("editModal")
    .style.display = "flex";

}



/* =========================
   編輯視窗課程按鈕
========================= */

document
  .querySelectorAll(".editCourse")
  .forEach(function(button) {


    button.addEventListener("click", function() {

      this.classList.toggle("selected");

    });


  });



/* =========================
   取消編輯
========================= */

document
  .getElementById("cancelEdit")
  .addEventListener("click", function() {


    document
      .getElementById("editModal")
      .style.display = "none";


    editingStudentId = null;


  });



/* =========================
   儲存編輯
========================= */

document
  .getElementById("saveEdit")
  .addEventListener("click", function() {


    if (!editingStudentId) {

      alert("找不到正在編輯的學生");

      return;

    }


    const name =
      document
        .getElementById("editName")
        .value
        .trim();


    const grade =
      document
        .getElementById("editGrade")
        .value;


    const status =
      document
        .getElementById("editStatus")
        .value;


    const courses =
      Array.from(
        document.querySelectorAll(
          ".editCourse.selected"
        )
      )
      .map(function(button) {

        return button.textContent.trim();

      });


    if (!name) {

      alert("請輸入學生姓名");

      return;

    }


    if (!grade) {

      alert("請選擇年級");

      return;

    }


    if (courses.length === 0) {

      alert("請至少選擇一個課程");

      return;

    }


    const saveButton =
      document.getElementById("saveEdit");


    saveButton.disabled = true;

    saveButton.textContent =
      "儲存中⋯";


    fetch(GAS_URL, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body: JSON.stringify({

        id: editingStudentId,

        name: name,

        grade: grade,

        status: status,

        courses: courses

      })

    })

    .then(function(response) {

      return response.json();

    })

    .then(function(data) {


      if (!data.success) {

        throw new Error(
          data.message || "修改失敗"
        );

      }


      alert(
        "✅ 學生資料修改成功！"
      );


      document
        .getElementById("editModal")
        .style.display = "none";


      editingStudentId = null;


      loadStudents();

    })

    .catch(function(error) {


      alert("❌ 修改失敗");


      console.error(error);

    })

    .finally(function() {


      saveButton.disabled = false;

      saveButton.textContent =
        "💾 儲存";

    });


  });



/* =========================
   啟動
========================= */

loadStudents();


</script>
